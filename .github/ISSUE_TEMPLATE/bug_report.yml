name: Bug report
description: Report reproducible behavior in the skill or CLI
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include customer data, private policies, credentials, or real approval references.
        Use a synthetic example that reproduces the issue.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "e.g. main at abc1234"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include only synthetic inputs and exact commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version and operating system.
    validations:
      required: true
